<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Repo Yard animated learning workshop</title><desc id="desc">Animated Git branches, a terminal, GitHub, and a learner journey.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#060b14"/><stop offset=".5" stop-color="#0b1220"/><stop offset="1" stop-color="#08100f"/></linearGradient>
  <linearGradient id="glow" x1="0" x2="1"><stop stop-color="#2dff83"/><stop offset=".5" stop-color="#4da3ff"/><stop offset="1" stop-color="#ff6bcb"/></linearGradient>
  <filter id="shadow"><feGaussianBlur stdDeviation="7"/></filter>
  <style>
    .pulse{animation:pulse 2.2s ease-in-out infinite}.float{animation:float 4s ease-in-out infinite}.dash{stroke-dasharray:10 10;animation:dash 3s linear infinite}.blink{animation:blink 1.2s steps(1) infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}} @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}} @keyframes dash{to{stroke-dashoffset:-40}} @keyframes blink{50%{opacity:.18}}
    @media (prefers-reduced-motion:reduce){.pulse,.float,.dash,.blink{animation:none}}
  </style>
</defs>
<rect width="1200" height="360" rx="28" fill="url(#bg)"/>
<rect x="14" y="14" width="1172" height="332" rx="22" fill="none" stroke="url(#glow)" stroke-width="2" opacity=".5"/>
<g opacity=".18" class="pulse"><circle cx="1015" cy="72" r="80" fill="#2dff83" filter="url(#shadow)"/><circle cx="210" cy="278" r="60" fill="#4da3ff" filter="url(#shadow)"/></g>
<g transform="translate(54 54)">
  <path d="M22 36 L72 8 L122 36 V99 C122 132 98 154 72 166 C46 154 22 132 22 99 Z" fill="#101a2a" stroke="#2dff83" stroke-width="4"/>
  <path d="M48 72 C48 58 58 48 72 48 C86 48 96 58 96 72 M72 48 V108 M54 98 H90" fill="none" stroke="#4da3ff" stroke-width="5" stroke-linecap="round"/>
  <text x="152" y="64" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="800">Repo <tspan fill="#2dff83">Yard</tspan></text>
  <text x="152" y="103" fill="#aeb9ca" font-family="Inter,Arial,sans-serif" font-size="20">Learn Git. Build with GitHub. Become team-ready.</text>
  <text x="152" y="142" fill="#6fe8a8" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16">the repository is the classroom</text>
</g>
<g class="float" transform="translate(54 214)">
  <rect width="500" height="108" rx="18" fill="#0c1522" stroke="#24354d"/>
  <circle cx="28" cy="24" r="6" fill="#ff5f57"/><circle cx="48" cy="24" r="6" fill="#febc2e"/><circle cx="68" cy="24" r="6" fill="#28c840"/>
  <text x="24" y="55" fill="#90a0b8" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">$ git switch -c feat/my-change</text>
  <text x="24" y="79" fill="#90a0b8" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">$ git add . &amp;&amp; git commit</text>
  <text x="24" y="103" fill="#2dff83" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">$ git push → Pull Request</text>
</g>
<g transform="translate(630 54)">
  <rect width="516" height="268" rx="22" fill="#0c1522" stroke="#24354d"/>
  <text x="28" y="36" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">REAL LEARNING LOOP</text>
  <g stroke="url(#glow)" stroke-width="3" fill="none">
    <path class="dash" d="M42 86 H470"/>
  </g>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <g><circle cx="48" cy="86" r="25" fill="#102a1c" stroke="#2dff83" stroke-width="3"/><text x="48" y="92" fill="#fff" font-size="13">LEARN</text></g>
    <g><circle cx="151" cy="86" r="25" fill="#13243a" stroke="#4da3ff" stroke-width="3"/><text x="151" y="92" fill="#fff" font-size="13">DO</text></g>
    <g><circle cx="254" cy="86" r="25" fill="#251b3b" stroke="#a67cff" stroke-width="3"/><text x="254" y="92" fill="#fff" font-size="13">PROVE</text></g>
    <g><circle cx="357" cy="86" r="25" fill="#362311" stroke="#ffb84d" stroke-width="3"/><text x="357" y="92" fill="#fff" font-size="13">EARN</text></g>
    <g><circle cx="460" cy="86" r="25" fill="#35172f" stroke="#ff6bcb" stroke-width="3"/><text x="460" y="92" fill="#fff" font-size="13">SHARE</text></g>
  </g>
  <g fill="#aeb9ca" font-family="Inter,Arial,sans-serif" font-size="15">
    <text x="28" y="138">Lessons explain the idea.</text>
    <text x="28" y="166">Missions make you perform it for real.</text>
    <text x="28" y="194">GitHub records evidence.</text>
    <text x="28" y="222">RYOS keeps your next step clear.</text>
  </g>
  <circle class="pulse" cx="48" cy="250" r="6" fill="#2dff83"/><text x="64" y="256" fill="#6fe8a8" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">no fake terminal · no fake progress</text>
</g>
</svg>