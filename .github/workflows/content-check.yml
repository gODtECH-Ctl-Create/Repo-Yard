name: Repo Yard Content Check

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  content-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Validate learning content
        run: node scripts/check-content.mjs
