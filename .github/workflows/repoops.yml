name: RepoOps IssueOps

on:
  issue_comment:
    types: [created]
  issues:
    types: [closed, assigned, unassigned, reopened, labeled, unlabeled]
  pull_request_target:
    types: [closed]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  repoops:
    if: >-
      ${{
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true) ||
        (github.event_name == 'issues' && github.event.issue.pull_request == null) ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request == null && github.event.comment.user.type == 'User')
      }}
    runs-on: ubuntu-latest
    concurrency:
      group: repoops-mutations-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Run RepoOps
        uses: gODtECH-Ctl-Create/RepoOps@v0.4.2
